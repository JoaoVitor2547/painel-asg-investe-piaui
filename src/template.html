  --c1:#8fb0ea; --c2:#f0b25a; --c3:#6fd19a; --c4:#c79be0; --c5:#f08a80; --c6:#6fd0e0; --c7:#a3adc2; color-scheme:dark } }
:root[data-theme="dark"]{

  --brand:#2b4675; --brand-deep:#14233f; --on-brand:#ffffff; --on-brand-soft:#c5d3ec;

<script>
"use strict";
// =====================================================================
// 1. DADOS — a base original vem embutida; edicoes ficam salvas neste navegador
// =====================================================================
const ORIG = JSON.parse(document.getElementById("dados").textContent);
const CHAVE = "painelASG.grupo2.v2";
const clone = o => JSON.parse(JSON.stringify(o));
let D = clone(ORIG), W = {amb:25, soc:25, gov:50}, EDITADO = false;
try { const s = JSON.parse(localStorage.getItem(CHAVE) || "null"); if (s && s.D && s.D.P) { D = s.D; W = s.W || W; EDITADO = true; } } catch (e) {}
const salvar = () => { EDITADO = true; try { localStorage.setItem(CHAVE, JSON.stringify({D, W})); } catch (e) {} };
const TOTAL_MUN_PI = 224; // municipios do Piaui (IBGE)

// =====================================================================
// 2. UTILITARIOS
// =====================================================================
const nf = (v,d=0)=> v==null||isNaN(v) ? "—" : Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const pct = (v,d=1)=> v==null||isNaN(v) ? "—" : nf(v*100,d)+"%";
const bi = v => "R$ "+nf(v/1e9,2)+" bi";
const mi = v => nf(v/1e6,0);
const sum = (a,f)=> a.reduce((s,x)=>s+(Number(f(x))||0),0);
const div = (a,b)=> b ? a/b : null;
const med = (a,f)=> a.length ? sum(a,f)/a.length : null;
const dias = (a,b)=> Math.round((new Date(b)-new Date(a))/864e5);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const grupo = (a,k)=> a.reduce((m,x)=>{(m[k(x)] ||= []).push(x);return m},{});
const conta = (a,k,v="Sim")=> a.filter(x=>x[k]===v).length;
const ult = id => D.R.filter(x=>x.id===id).sort((a,b)=>b.ano-a.ano)[0] || {};
const ST = ["Implantado","Em implantação","Em estruturação"];
const SETORES = ["Energia","Agro","Turismo","Mineração","ZPE","Porto","Multissetorial"];
const corSetor = s => `var(--c${SETORES.indexOf(s)%7+1})`;

// =====================================================================
// 3. CALCULO — todas as contas em um lugar so; o resultado fica em M
// =====================================================================
function calcular(){
  const P=D.P, imp=P.filter(p=>p.st===ST[0]), emi=P.filter(p=>p.st===ST[1]), est=P.filter(p=>p.st===ST[2]);
  const prev=sum(P,p=>p.ip), real=sum(P,p=>p.ir);
  const resp=D.X.filter(x=>x.dias!=null), dentro=resp.filter(x=>x.dias<=x.sla);
  const semar=resp.filter(x=>x.org==="SEMAR"), semarOk=semar.filter(x=>x.dias<=x.sla);
  const muns=grupo(P.filter(p=>p.cid),p=>p.cid), munInv=Object.entries(muns).map(([m,a])=>[m,sum(a,p=>p.ip)]).sort((a,b)=>b[1]-a[1]);
  const s25=D.S.filter(s=>String(s.m).startsWith("2025")), s26=D.S.filter(s=>String(s.m).startsWith("2026"));
  const ciclo=P.filter(p=>p.da&&p.dc);
  // temas T1 e T14
  const ddOk=D.G.filter(g=>g.dd==="Sim"), alto=ddOk.filter(g=>g.risco==="Alto"), altoPend=alto.filter(g=>g.pend==="Sim");
  const conc=D.N.filter(n=>n.dias!=null), concOk=conc.filter(n=>n.dias<=n.meta);
  const test=D.I.filter(i=>i.test==="Sim"), efet=test.filter(i=>i.res==="Efetivo");
  return {P,imp,emi,est,prev,real,resp,dentro,semar,semarOk,munInv,s25,s26,ddOk,alto,altoPend,conc,concOk,test,efet,
    conv:div(imp.length,P.length), exec:div(real,prev),
    ciclo:med(ciclo,p=>dias(p.da,p.dc)),
    sla:div(dentro.length,resp.length), prazo:med(resp,x=>x.dias), pend:D.X.length-resp.length,
    contr:div(conta(D.C,"asg","SIM"),D.C.length), nContr:D.C.length, asg:conta(D.C,"asg","SIM"),
    comun:div(new Set(D.K.map(k=>k.prj)).size,P.length),
    ger:sum(imp,p=>p.eg), previstos:sum(emi,p=>p.ep), indir:sum(P,p=>p.ei),
    gerPrev:div(sum(imp,p=>p.eg),sum(imp,p=>p.ep)+sum(emi,p=>p.ep)),
    nMun:Object.keys(muns).length, cobertura:Object.keys(muns).length/TOTAL_MUN_PI,
    top5:div(sum(munInv.slice(0,5),x=>x[1]),prev),
    energia:div(sum(P.filter(p=>p.s==="Energia"),p=>p.ip),prev),
    missao:div(conta(P,"miss"),P.length), estr:div(conta(P,"estr"),P.length),
    empEstr:div(D.E.filter(e=>e.pais!=="Brasil").length,D.E.length), nPaises:new Set(D.E.map(e=>e.pais)).size,
    kwh25:med(s25,s=>s.kwh), kwh26:med(s26,s=>s.kwh), agua26:med(s26,s=>s.agua), res26:med(s26,s=>s.res),
    slaAmb:div(semarOk.length,semar.length),
    trein:div(conta(D.T,"trein"),D.T.length), codigo:div(conta(D.T,"cod"),D.T.length), conflito:div(conta(D.T,"conf"),D.T.length),
    dd:div(ddOk.length,D.G.length), decl:div(conta(D.G,"decl"),D.G.length), altoPendPct:div(altoPend.length,alto.length),
    anti:div(conta(D.C,"anti"),D.C.length), forn:div(conta(D.C,"forn"),D.C.length),
    denPrazo:div(concOk.length,conc.length), denMedio:med(conc,n=>n.dias), denAbertas:D.N.length-conc.length,
    ctrlTest:div(test.length,D.I.length), ctrlEfet:div(efet.length,test.length) };
}

// =====================================================================
// 4. CATALOGO — compromissos, temas materiais e indicadores
// =====================================================================
// Compromissos: redacao do grupo a partir da missao da agencia. Trocar pelo texto oficial quando disponivel.
const COMP = [
 {id:"C1",t:"Atrair investimento estratégico e diversificar a economia"},
 {id:"C2",t:"Gerar emprego e renda"},
 {id:"C3",t:"Liderar a transição energética"},
 {id:"C4",t:"Levar desenvolvimento a todos os territórios"},
 {id:"C5",t:"Gestão íntegra, transparente e ágil"},
 {id:"C6",t:"Inclusão e equidade"} ];
// Temas da Matriz de Materialidade atribuidos ao Grupo 2
const TEMAS = [

const PIL = {amb:"Ambiental",soc:"Social",gov:"Governança"};
const ORG = {calc:["calc","Calculado da base"],demo:["demo","Demonstração"],nd:["nd","Sem dado ainda"]};

// SCORE: nota de 0 a 100 de cada indicador com meta = quanto da meta ja foi alcancado
//   quanto maior melhor: valor / meta      quanto menor melhor: meta / valor      (limitado a 100)
const nota = i => (i.v==null||i.m==null||isNaN(i.v)) ? null : Math.max(0,Math.min(1, i.dir>0 ? i.v/i.m : (i.v<=0 ? 1 : i.m/i.v)))*100;
const media = l => { const n=l.map(i=>i.sc).filter(x=>x!=null); return n.length ? n.reduce((a,b)=>a+b,0)/n.length : null; };
let M, IND, SC;
function recalcular(){
  M = calcular(); IND = catalogo(M); IND.forEach(i=>i.sc=nota(i));
  const p = k => media(IND.filter(i=>i.pilar===k));
  SC = {amb:p("amb"), soc:p("soc"), gov:p("gov"), T1:media(IND.filter(i=>i.mat==="T1")), T14:media(IND.filter(i=>i.mat==="T14"))};
  const ws = ["amb","soc","gov"].filter(k=>SC[k]!=null), tw = sum(ws,k=>W[k]);
  SC.geral = tw ? sum(ws,k=>SC[k]*W[k])/tw : null;   // Score ASG = media ponderada dos tres pilares
}
recalcular();

// 5. COMPONENTES VISUAIS (devolvem HTML/SVG em texto)
// =====================================================================
const faixa = s => s==null ? "" : s>=80 ? "o" : s>=50 ? "w" : "b";
const bars = (rows,fmt,teto,cor)=> { const mx=teto||Math.max(...rows.map(r=>r[1]),1e-9);
  return `<div class="bars">${rows.map(r=>`<div class="bar"><span class="lb" title="${esc(r[0])}">${esc(r[0])}</span><div class="t"><div class="f" style="width:${Math.max(1,Math.min(100,r[1]/mx*100)).toFixed(1)}%;${r[2]?`background:${r[2]}`:cor?`background:${cor}`:""}"></div></div><span class="n">${fmt(r[1])}</span></div>`).join("")}</div>`; };
const cols = (rows,fmt)=> { const mx=Math.max(...rows.map(r=>r[1]),1e-9);
  return `<div class="cols">${rows.map(r=>`<div class="col"><b>${fmt(r[1])}</b><i style="height:${(r[1]/mx*78).toFixed(1)}%"></i><span>${esc(r[0])}</span></div>`).join("")}</div>`; };
const ring = (v,lab,cor="var(--accent)",sz=112)=> { const r=44,c=2*Math.PI*r,p=v==null?0:v/100;
  return `<div class="ring"><svg viewBox="0 0 112 112" width="${sz}" height="${sz}" role="img" aria-label="${esc(lab)}: ${v==null?"sem dado":nf(v)+" de 100"}"><circle cx="56" cy="56" r="${r}" fill="none" stroke="var(--surface2)" stroke-opacity=".55" stroke-width="11"/><circle cx="56" cy="56" r="${r}" fill="none" stroke="${cor}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${(c*p).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 56 56)"/><text x="56" y="65" text-anchor="middle" class="rv">${v==null?"—":nf(v)}</text></svg><span>${esc(lab)}</span></div>`; };
const donut = (rows,centro,nome)=> { const tot=sum(rows,r=>r[1])||1,r=40,c=2*Math.PI*r; let acc=0;
  const cor=(x,i)=>x[2]||`var(--c${i%7+1})`;
  const segs=rows.map((x,i)=>{const len=x[1]/tot*c, s=`<circle cx="56" cy="56" r="${r}" fill="none" stroke="${cor(x,i)}" stroke-width="16" stroke-dasharray="${len.toFixed(2)} ${(c-len).toFixed(2)}" stroke-dashoffset="${(-acc).toFixed(2)}" transform="rotate(-90 56 56)"/>`; acc+=len; return s}).join("");
  return `<div class="donut"><svg viewBox="0 0 112 112" width="150" height="150" role="img" aria-label="${esc(nome)}">${segs}<text x="56" y="64" text-anchor="middle" class="rv" style="font-size:22px">${centro}</text></svg><ul class="leg">${rows.map((x,i)=>`<li><i style="background:${cor(x,i)}"></i><span>${esc(x[0])}</span><b>${nf(x[1])} · ${pct(x[1]/tot,0)}</b></li>`).join("")}</ul></div>`; };
const pilha = (rows,fmt)=> { const tot=sum(rows,r=>r[1])||1;
  return `<div class="pilha" role="img" aria-label="${rows.map(r=>r[0]+": "+fmt(r[1])).join("; ")}">${rows.map((r,i)=>`<i style="width:${(r[1]/tot*100).toFixed(2)}%;background:${r[2]||`var(--c${i+1})`}"></i>`).join("")}</div><div class="legh">${rows.map((r,i)=>`<span><i style="background:${r[2]||`var(--c${i+1})`}"></i>${esc(r[0])}: <b style="color:var(--ink)">${fmt(r[1])}</b> (${pct(r[1]/tot,0)})</span>`).join("")}</div>`; };
function linha(S,campo,nome){ if(S.length<2) return `<p class="nota">Dados insuficientes para o gráfico.</p>`;
  const w=560,h=170,pl=46,pb=22,pt=10, vs=S.map(s=>Number(s[campo])||0), mn=Math.min(...vs)*.95, mx=Math.max(...vs)*1.05||1;
  const x=i=>pl+i*(w-pl-10)/(S.length-1), y=v=>pt+(mx-v)/((mx-mn)||1)*(h-pt-pb);
  const pts=vs.map((v,i)=>x(i).toFixed(1)+","+y(v).toFixed(1)).join(" "), tk=[mn,(mn+mx)/2,mx];
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:420px" role="img" aria-label="${esc(nome)}">
   ${tk.map(v=>`<line x1="${pl}" x2="${w-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`).join("")}
   <polygon points="${x(0)},${h-pb} ${pts} ${x(S.length-1)},${h-pb}" fill="var(--accent)" fill-opacity=".12"/>
   <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="2"/>
   <circle cx="${x(S.length-1)}" cy="${y(vs.at(-1))}" r="4" fill="var(--accent)"/>
   ${S.map((s,i)=> i%4===0||i===S.length-1 ? `<text x="${x(i)}" y="${h-6}" text-anchor="${i===S.length-1?"end":"middle"}">${esc(String(s.m).slice(5))}/${esc(String(s.m).slice(2,4))}</text>`:"").join("")}
  </svg></div>`; }
function dispersao(){ const L=D.P.filter(p=>p.ep>0&&p.ip>0); if(!L.length) return `<p class="nota">Sem projetos com emprego previsto.</p>`;
  const w=560,h=250,pl=46,pb=30,pt=10, lx=v=>Math.log10(v/1e6), x0=Math.floor(Math.min(...L.map(p=>lx(p.ip)))), x1=Math.ceil(Math.max(...L.map(p=>lx(p.ip)))), my=Math.max(...L.map(p=>p.ep))*1.08;
  const x=v=>pl+(lx(v)-x0)/((x1-x0)||1)*(w-pl-12), y=v=>pt+(my-v)/my*(h-pt-pb), tx=[]; for(let k=x0;k<=x1;k++) tx.push(k);
  return `<div style="overflow-x:auto"><svg viewBox="0 0 ${w} ${h}" width="100%" style="min-width:420px" role="img" aria-label="Cada ponto é um projeto: investimento previsto no eixo horizontal, empregos diretos previstos no vertical">

function leitura(){ const por=SETORES.map(s=>[s,sum(D.P.filter(p=>p.s===s),p=>p.ip)]).sort((a,b)=>b[1]-a[1])[0];
  const piores=IND.filter(i=>i.sc!=null).sort((a,b)=>a.sc-b.sc).slice(0,4), melhores=IND.filter(i=>i.sc!=null).sort((a,b)=>b.sc-a.sc).slice(0,2);
  const f=[];
  if(por&&M.prev) f.push(["Carteira",`${por[0]} lidera com ${pct(por[1]/M.prev,0)} do investimento previsto; ${M.imp.length} de ${M.P.length} projetos já estão implantados.`]);
  if(M.altoPend.length) f.push(["Atenção",`${M.altoPend.length} empresa(s) de risco alto seguem com pendência de integridade aberta.`]);
  if(M.denAbertas) f.push(["Atenção",`${M.denAbertas} relato(s) do canal de denúncias ainda em apuração; prazo médio dos concluídos: ${nf(M.denMedio)} dias.`]);
  if(D.I.length-M.test.length) f.push(["Atenção",`${D.I.length-M.test.length} de ${D.I.length} controles internos ainda não foram testados neste ano.`]);
  piores.forEach(i=>f.push(["Mais longe da meta",`${i.id} ${i.nome}: ${i.f(i.v)} para uma meta de ${i.f(i.m)} (nota ${nf(i.sc)}).`]));
  melhores.forEach(i=>f.push(["Destaque",`${i.id} ${i.nome}: ${i.f(i.v)} (nota ${nf(i.sc)}).`]));
  return `<ul class="alertas">${f.map(x=>`<li><span class="chip ${x[0]==="Destaque"?"calc":x[0]==="Carteira"?"gov":x[0]==="Atenção"?"bad":"demo"}">${x[0]}</span><span>${esc(x[1])}</span></li>`).join("")}</ul>`; }

   ${L.map((r,i)=>`<tr><td style="white-space:nowrap"><button class="bt mini" data-ed="${i}">Editar</button> <button class="bt mini perigo" data-del="${i}">Excluir</button></td>${e.f.map(f=>`<td>${esc(r[f[0]]??"—")}</td>`).join("")}</tr>`).reverse().join("")||`<tr><td colspan="${e.f.length+1}">Tabela vazia.</td></tr>`}
   </tbody></table></div><p class="nota" style="margin:0">Os registros mais recentes aparecem primeiro.</p></div>

   <div class="panel"><h3>Pesos do Score ASG</h3>
    <div class="form">${["amb","soc","gov"].map(k=>`<label class="cp" for="w-${k}">${PIL[k]}<input id="w-${k}" type="number" min="0" max="100" step="5" value="${W[k]}"></label>`).join("")}</div>

 },
 dados(){
  const P=D.P, s=(st,f)=>sum(P.filter(p=>p.st===st),f), MI=1e6, ids=P.map(p=>p.c), emp=new Set(D.E.map(e=>e.c)), ct=new Set(D.C.map(c=>c.id));
  const T=[
   ["T01","Total de projetos na carteira",120,P.length],

   ["T05","Investimento previsto total (R$ mi)",44700,M.prev/MI],
   ["T06","Previsto — implantados (R$ mi)",11870,s(ST[0],p=>p.ip)/MI],["T07","Previsto — em implantação (R$ mi)",23370,s(ST[1],p=>p.ip)/MI],["T08","Previsto — em estruturação (R$ mi)",9460,s(ST[2],p=>p.ip)/MI],
   ["T09","Realizado — implantados (R$ mi)",11870,s(ST[0],p=>p.ir)/MI],
   ["T10","Empregos gerados — implantados",10500,M.ger],["T11","Empregos previstos — em implantação",25200,M.previstos],
   ["T12","Projetos sem município",0,P.filter(p=>!p.cid).length],
   ["T13","Códigos de projeto duplicados",0,ids.length-new Set(ids).size],
   ["T14","Projetos apontando para empresa inexistente",0,P.filter(p=>!emp.has(p.e)).length],
   ["T15","Projetos com realizado maior que o previsto",0,P.filter(p=>p.ir>p.ip).length],
   ["T16","Due diligence de empresa fora da carteira",0,D.G.filter(g=>!emp.has(g.e)).length],
   ["T17","Empresas da carteira sem registro de due diligence",0,D.E.filter(e=>!D.G.some(g=>g.e===e.c)).length],
   ["T18","Controles testados sem resultado informado",0,D.I.filter(i=>i.test==="Sim"&&!i.res).length],
   ["T19","Relatos concluídos com prazo negativo",0,D.N.filter(n=>n.dias!=null&&n.dias<0).length],

  ];
  const ok=T.filter(t=>Math.abs(t[2]-t[3])<.01).length, cont=k=>IND.filter(i=>i.o===k).length;
  return `<div class="sec"><div><h2>Qualidade dos dados</h2><p class="lead">Os testes rodam no navegador toda vez que o painel abre ou um dado é editado. Os onze primeiros conferem a carteira com os totais oficiais divulgados pelo Governo do Piauí em dezembro de 2025; os demais conferem a estrutura das tabelas.</p></div>
   ${EDITADO?`<div class="aviso"><b>Base alterada por você.</b> Se um teste de T01 a T11 aparecer em ERRO, é porque as suas edições mudaram os totais da carteira em relação ao número oficial.</div>`:""}
   <div class="grid g4">
    <div class="panel kpi"><div class="v">${ok}/${T.length}</div><div class="l">testes aprovados</div></div>
    <div class="panel kpi"><div class="v">${cont("calc")}</div><div class="l">indicadores calculados da base</div></div>
    <div class="panel kpi"><div class="v">${cont("demo")}</div><div class="l">com medição de demonstração</div></div>
    <div class="panel kpi"><div class="v">${cont("nd")}</div><div class="l">aguardando dado das empresas</div></div>
   </div>
   <div class="tw"><table><thead><tr><th>Teste</th><th>O que confere</th><th class="num">Esperado</th><th class="num">Obtido</th><th>Resultado</th></tr></thead><tbody>
   ${T.map(t=>{const o=Math.abs(t[2]-t[3])<.01;return `<tr><td>${t[0]}</td><td>${t[1]}</td><td class="num">${nf(t[2])}</td><td class="num">${nf(t[3])}</td><td><span class="chip ${o?"calc":"bad"}">${o?"OK":"ERRO"}</span></td></tr>`}).join("")}
   </tbody></table></div></div>
  <div class="sec"><h3>De onde vem cada dado</h3>
   <div class="tw"><table><thead><tr><th>Tabela</th><th class="num">Registros</th><th>Origem hoje</th><th>O que falta para virar dado real</th></tr></thead><tbody>
    <tr><td>Projetos + CidadeProjeto</td><td class="num">${P.length}</td><td>Sintético calibrado</td><td>Cadastro real da Investe Piauí, sob termo de confidencialidade</td></tr>
    <tr><td>Empresas</td><td class="num">${D.E.length}</td><td>Sintético</td><td>Cadastro real; CNPJ fica fora da versão pública</td></tr>
    <tr><td>Processos_Externos</td><td class="num">${D.X.length}</td><td>Sintético</td><td>Registro das demandas à SEMAR, INTERPI e Equatorial</td></tr>
    <tr><td>CONTRATOS + CONTRATOS_INTEGRIDADE</td><td class="num">${D.C.length}</td><td>Sintético</td><td>Lista do jurídico/compliance</td></tr>
    <tr><td>DUE_DILIGENCE</td><td class="num">${D.G.length}</td><td>Sintético</td><td>Análises de integridade das empresas</td></tr>
    <tr><td>CANAL_DENUNCIAS</td><td class="num">${D.N.length}</td><td>Sintético</td><td>Registros do canal, sem identificar pessoas</td></tr>
    <tr><td>COLABORADORES_INTEGRIDADE</td><td class="num">${D.T.length}</td><td>Sintético</td><td>Controle de treinamentos e termos do RH</td></tr>
    <tr><td>CONTROLES_INTERNOS</td><td class="num">${D.I.length}</td><td>Sintético</td><td>Matriz de riscos e controles da agência</td></tr>
    <tr><td>CONSUMO_SEDE</td><td class="num">${D.S.length} meses</td><td>Sintético</td><td>Contas de energia e água da sede</td></tr>
    <tr><td>Comunicação</td><td class="num">${D.K.length}</td><td>Sintético</td><td>Registro da assessoria de comunicação</td></tr>
    <tr><td>Medições (MW, e-SIC, RH, Investe Nelas)</td><td class="num">${D.R.length}</td><td>Demonstração</td><td>ANEEL/SIGA, Portal da Transparência, RH e programa</td></tr>
   </tbody></table></div>
   <p class="rodape">Projeto acadêmico do Grupo 2 (iCEV, Ciência de Dados 2026.2) para o Desafio Investe Piauí. Não é um canal oficial da agência. Estrutura da carteira conforme o dicionário de dados de exemplo da Investe Piauí. Fonte dos totais oficiais: Governo do Piauí, "Piauí atrai 120 empreendimentos entre 2023 e 2025 e projeta R$ 44,7 bilhões em investimentos", dez. 2025.</p></div>`;
 }
};

// =====================================================================
// 7. EDITOR — esquema de cada tabela editavel: [chave, rotulo, tipo, opcoes]
// =====================================================================
const SN=["Sim","Não"], SNV=["","Sim","Não"];
const ESQ = {
 P:{t:"Projetos",id:"c",f:[["c","Código","text"],["n","Nome do projeto","text"],["e","Código da empresa","text"],["s","Setor","sel",SETORES],["cid","Município","text"],["st","Status","sel",ST],["da","Data de atração","date"],["dc","Data de captação","date"],["ip","Investimento previsto (R$)","num"],["ir","Investimento realizado (R$)","num"],["ep","Empregos previstos","num"],["eg","Empregos gerados","num"],["ei","Empregos indiretos","num"],["miss","Captado em missão","sel",SN],["estr","Investimento estrangeiro","sel",SN]]},
 G:{t:"Due diligence",id:"e",f:[["e","Código da empresa","text"],["dd","Análise realizada","sel",SN],["risco","Nível de risco","sel",["","Baixo","Médio","Alto"]],["pend","Pendência aberta","sel",SNV],["decl","Declaração anticorrupção","sel",SN]]},
 N:{t:"Canal de denúncias",id:"id",f:[["id","ID do relato","text"],["dr","Data do registro","date"],["cat","Categoria","sel",["Conflito de interesses","Fraude ou corrupção","Descumprimento de norma interna","Assédio ou conduta","Outros"]],["meta","Prazo-meta (dias)","num"],["dias","Dias até concluir (vazio = em apuração)","num"],["proc","Procedente","sel",SNV]]},
 T:{t:"Colaboradores",id:"id",f:[["id","ID do colaborador","text"],["area","Área","text"],["trein","Treinamento de integridade","sel",SN],["cod","Código de conduta assinado","sel",SN],["conf","Declaração de conflito entregue","sel",SN]]},
 I:{t:"Controles internos",id:"id",f:[["id","ID do controle","text"],["nome","Controle","text"],["proc","Processo","text"],["test","Testado no ano","sel",SN],["res","Resultado","sel",["","Efetivo","Com falha"]],["plano","Plano de ação no prazo","sel",SNV]]},
 C:{t:"Contratos",id:"id",f:[["id","ID do contrato","text"],["ano","Ano","num"],["obj","Objeto","text"],["asg","Cláusula ASG","sel",["SIM","NÃO"]],["anti","Cláusula anticorrupção","sel",SN],["forn","Fornecedor avaliado","sel",SN]]},
 X:{t:"Demandas externas",id:"id",f:[["id","ID da demanda","text"],["org","Órgão","sel",["SEMAR","INTERPI","Equatorial"]],["nome","Demanda","text"],["prj","Código do projeto","text"],["sla","Prazo SLA (dias)","num"],["dias","Dias até a resposta (vazio = sem resposta)","num"]]},
 S:{t:"Consumo da sede",id:"m",f:[["m","Mês (AAAA-MM)","text"],["kwh","Energia (kWh)","num"],["agua","Água (m³)","num"],["res","Resíduos (kg)","num"]]},
};
// converte o texto digitado para o tipo do campo; devolve [valor, erro]
function converter([k,lab,tp],txt){ txt=String(txt??"").trim();
  if(tp==="num"){ if(txt==="") return [null,null]; const n=Number(txt.replace(/\./g,"").replace(",",".")), n2=Number(txt.replace(",",".")); const v=isNaN(n)?n2:(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(txt)||txt.includes(",")?n:n2); return isNaN(v)||v<0 ? [null,`${lab}: digite um número não negativo.`] : [v,null]; }
  if(tp==="date"&&txt&&!/^\d{4}-\d{2}-\d{2}$/.test(txt)) return [null,`${lab}: use o formato AAAA-MM-DD.`];
  return [txt===""?null:txt,null]; }
function validar(tab,r,idx){ const e=ESQ[tab], id=r[e.id];
  if(!id) return `${e.f[0][1]} é obrigatório.`;
  if(D[tab].some((x,i)=>x[e.id]===id&&i!==idx)) return `Já existe um registro com ${e.f[0][1]} = ${id}.`;
  if(tab==="P"){ if(!r.n) return "Nome do projeto é obrigatório."; if(r.ip==null||r.ip<=0) return "Investimento previsto deve ser maior que zero."; if((r.ir||0)>r.ip) return "O realizado não pode ser maior que o previsto."; if(r.da&&r.dc&&r.dc<r.da) return "A captação não pode ser anterior à atração."; r.ir=r.ir||0; }
  if((tab==="X")&&(r.sla==null)) return "Prazo SLA é obrigatório.";
  if((tab==="N")&&(r.meta==null)) return "Prazo-meta é obrigatório.";
  if(tab==="S"&&!/^\d{4}-\d{2}$/.test(r.m)) return "Mês deve estar no formato AAAA-MM.";
  return null; }
function aplicar(fn){ UI.antes=SC.geral; fn(); salvar(); recalcular(); }
function lerCSV(txt,tab){ const e=ESQ[tab], ls=txt.replace(/^﻿/,"").split(/\r?\n/).filter(l=>l.trim()); if(ls.length<2) throw new Error("O arquivo não tem linhas de dados.");
  const sep=ls[0].includes(";")?";":",", cab=ls[0].split(sep).map(s=>s.trim().replace(/^"|"$/g,"")), novos=[];
  const falta=e.f.map(f=>f[0]).filter(k=>!cab.includes(k)&&k===e.id); if(falta.length) throw new Error("Falta a coluna "+falta[0]+" na primeira linha.");
  ls.slice(1).forEach((l,n)=>{ const cel=l.split(sep).map(s=>s.trim().replace(/^"|"$/g,"")), r={};
    for(const f of e.f){ const i=cab.indexOf(f[0]); const [v,err]=converter(f,i<0?"":cel[i]); if(err) throw new Error(`Linha ${n+2}: ${err}`); r[f[0]]=v; }
    const err=validar(tab,r,-1)||(novos.some(x=>x[e.id]===r[e.id])?"código repetido no arquivo.":null); if(err) throw new Error(`Linha ${n+2}: ${err}`); novos.push(r); });
  return novos; }

// 8. NAVEGACAO E EVENTOS
// =====================================================================
const app=document.getElementById("app");
function render(manter){
  let r=(location.hash||"#geral").slice(1); if(!Object.hasOwn(telas,r)) r="geral";
  const y=scrollY; app.innerHTML=telas[r](); if(manter) scrollTo(0,y);
  document.querySelectorAll("#nav a").forEach(a=> a.getAttribute("href")==="#"+r ? a.setAttribute("aria-current","page") : a.removeAttribute("aria-current"));
}
const aviso=(m,erro=false)=>{UI.msg=m;UI.erro=erro};
app.addEventListener("click",ev=>{ const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.c){ UI.c=b.dataset.c; return render(true); }
  if(b.dataset.tab){ UI.tab=b.dataset.tab; UI.edit=null; aviso(""); return render(true); }
  if(b.dataset.ed!=null){ UI.edit=Number(b.dataset.ed); aviso("Registro carregado no formulário acima."); render(true); document.getElementById("f-ed")?.scrollIntoView({block:"center"}); return; }
  if(b.dataset.del!=null){ const i=Number(b.dataset.del), id=D[UI.tab][i][ESQ[UI.tab].id]; aplicar(()=>D[UI.tab].splice(i,1)); UI.edit=null; aviso(`Registro ${id} excluído. Indicadores recalculados.`); return render(true); }
  const a=b.dataset.acao; if(!a) return;
  if(a==="cancelar"){ UI.edit=null; aviso(""); return render(true); }
  if(a==="restaurar"){ UI.confirma=true; return render(true); }
  if(a==="restaurar-nao"){ UI.confirma=false; return render(true); }
  if(a==="restaurar-sim"){ D=clone(ORIG); W={amb:25,soc:25,gov:50}; EDITADO=false; UI.confirma=false; UI.edit=null; UI.antes=null; try{localStorage.removeItem(CHAVE)}catch(e){} recalcular(); aviso("Base original restaurada."); return render(true); }
  if(a==="exportar"){ const txt=JSON.stringify({D,W},null,1);
    try{ const u=URL.createObjectURL(new Blob([txt],{type:"application/json"})), l=document.createElement("a"); l.href=u; l.download="base_painel_asg.json"; document.body.append(l); l.click(); l.remove(); setTimeout(()=>URL.revokeObjectURL(u),2000);}catch(e){}
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>{aviso("Base exportada: arquivo baixado e conteúdo copiado para a área de transferência.");render(true)},()=>{aviso("Base exportada como base_painel_asg.json.");render(true)}); }
});
app.addEventListener("submit",ev=>{ if(ev.target.id!=="f-ed") return; ev.preventDefault();
  const e=ESQ[UI.tab], r={}; for(const f of e.f){ const [v,err]=converter(f,document.getElementById("ed-"+f[0]).value); if(err){aviso(err,true);return render(true)} r[f[0]]=v; }
  const idx=UI.edit??-1, err=validar(UI.tab,r,idx); if(err){ aviso(err,true); return render(true); }
  aplicar(()=>{ if(idx>=0) D[UI.tab][idx]={...D[UI.tab][idx],...r}; else D[UI.tab].push(r); });
  aviso(`Registro ${r[e.id]} ${idx>=0?"alterado":"adicionado"}. Indicadores e gráficos recalculados.`); UI.edit=null; render(true);
});
app.addEventListener("change",ev=>{ const t=ev.target;
  if(t.id==="f-setor"||t.id==="f-status"){ UI.fs=document.getElementById("f-setor").value; UI.ft=document.getElementById("f-status").value; return render(true); }
  if(t.id&&t.id.startsWith("w-")){ const v=Math.max(0,Math.min(100,Number(t.value)||0)); aplicar(()=>{W[t.id.slice(2)]=v}); return render(true); }
  if((t.id==="imp-json"||t.id==="imp-csv")&&t.files[0]){ const fr=new FileReader(), csv=t.id==="imp-csv";
    fr.onload=()=>{ try{ if(csv){ const novos=lerCSV(String(fr.result),UI.tab); aplicar(()=>D[UI.tab].push(...novos)); aviso(`${novos.length} registros importados para ${ESQ[UI.tab].t}.`); }
        else { const o=JSON.parse(String(fr.result)), d=o.D||o; if(!Object.keys(ORIG).every(k=>Array.isArray(d[k]))) throw new Error("O arquivo não tem todas as tabelas do painel."); aplicar(()=>{D=d; if(o.W) W=o.W}); aviso("Base importada."); }
      }catch(e){ aviso("Importação recusada: "+e.message,true); } UI.edit=null; render(true); };
    fr.readAsText(t.files[0]); }
});
addEventListener("hashchange",()=>{UI.edit=null;aviso("");render();scrollTo(0,0)});
render();
</script>
